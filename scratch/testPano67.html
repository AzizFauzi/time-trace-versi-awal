<!DOCTYPE html>
<html>
<head>
  <title>Test StreetView Pano 67</title>
  <style>
    body, html, #pano { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; }
    #log { position: absolute; top: 10px; left: 10px; z-index: 999; background: rgba(0,0,0,0.8); color: #fff; font-family: monospace; padding: 10px; max-height: 200px; overflow: auto; }
  </style>
</head>
<body>
  <div id="log">Starting...</div>
  <div id="pano"></div>
  <script>
    const log = (msg) => {
      console.log(msg);
      document.getElementById('log').innerHTML += '<br/>' + msg;
    };
    window.initPano = () => {
      log('Google Maps loaded');
      const panoDiv = document.getElementById('pano');
      const svService = new google.maps.StreetViewService();
      
      // Try with position 31.6258, -7.9891
      const pos = { lat: 31.6258, lng: -7.9891 };
      
      svService.getPanorama({ location: pos, radius: 200 }, (data, status) => {
        log('getPanorama status: ' + status);
        if (status === 'OK') {
          log('Pano ID: ' + data.location.pano);
          log('Copyright: ' + data.copyright);
          
          const panorama = new google.maps.StreetViewPanorama(panoDiv, {
            pano: data.location.pano,
            position: data.location.latLng,
            pov: { heading: 250, pitch: 5 }
          });
          
          panorama.addListener('status_changed', () => {
            log('panorama status_changed: ' + panorama.getStatus());
          });
          panorama.addListener('pano_changed', () => {
            log('panorama pano_changed: ' + panorama.getPano());
          });
        }
      });
    };
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAyHABnIHtU02YfBdzsXoK8wDg2_N324Uc&callback=initPano"></script>
</body>
</html>
