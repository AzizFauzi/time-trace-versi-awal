<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Aged Parchment Gradients -->
    <radialGradient id="parchmentBase" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1611" />
      <stop offset="45%" stop-color="#14100c" />
      <stop offset="80%" stop-color="#0a0806" />
      <stop offset="100%" stop-color="#040302" />
    </radialGradient>

    <radialGradient id="hemisphereGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#b8860b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="compassGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdf79" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Vintage Coordinate Grid Pattern -->
    <pattern id="coordGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#99733e" stroke-width="0.5" stroke-opacity="0.2" stroke-dasharray="1,3" />
      <circle cx="40" cy="40" r="1" fill="#c29b62" fill-opacity="0.3" />
    </pattern>

    <!-- Continental Coastal Hatch Pattern -->
    <pattern id="oceanLines" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 10 Q 5 7 10 10 T 20 10" fill="none" stroke="#78552b" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Dark Aged Parchment Background Layer -->
  <rect width="1920" height="1080" fill="url(#parchmentBase)" />
  <rect width="1920" height="1080" fill="url(#coordGrid)" />
  <rect width="1920" height="1080" fill="url(#oceanLines)" />

  <!-- DUAL HEMISPHERES CARTOGRAPHY BORDERS (Classic 17th Century World Map) -->
  <!-- Western Hemisphere Circle (Americas & Pacific) -->
  <g transform="translate(560, 540)">
    <circle r="440" fill="none" stroke="#8c622b" stroke-width="2" stroke-opacity="0.4" />
    <circle r="432" fill="none" stroke="#c29b62" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.5" />
    <circle r="424" fill="none" stroke="#8c622b" stroke-width="1.5" stroke-opacity="0.3" />
    <circle r="420" fill="url(#hemisphereGlow)" />

    <!-- Degree Ticks Around Ring -->
    <g stroke="#d4af37" stroke-width="0.8" opacity="0.3">
      <line x1="0" y1="-432" x2="0" y2="-420" />
      <line x1="0" y1="420" x2="0" y2="432" />
      <line x1="-432" y1="0" x2="-420" y2="0" />
      <line x1="420" y1="0" x2="432" y2="0" />
    </g>

    <!-- Curved Latitude Lines -->
    <ellipse cx="0" cy="0" rx="420" ry="140" fill="none" stroke="#a07238" stroke-width="0.8" stroke-dasharray="6,4" stroke-opacity="0.35" />
    <ellipse cx="0" cy="0" rx="420" ry="280" fill="none" stroke="#a07238" stroke-width="0.8" stroke-dasharray="6,4" stroke-opacity="0.35" />
    <line x1="-420" y1="0" x2="420" y2="0" stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="8,6" />
    <line x1="0" y1="-420" x2="0" y2="420" stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="8,6" />

    <!-- Western Continents (North & South America) Detailed Silhouette -->
    <g fill="#996e38" fill-opacity="0.22" stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.45" stroke-linejoin="round">
      <!-- North America Silhouette -->
      <path d="M -120 -290 Q -80 -250 -40 -270 Q 20 -260 50 -200 Q 80 -170 30 -140 Q 60 -100 20 -60 Q -20 -40 -60 -20 Q -90 -30 -110 -60 Q -150 -50 -190 -100 Q -240 -120 -230 -180 Q -200 -210 -180 -260 Z" />
      <!-- Central & South America Silhouette -->
      <path d="M -60 -20 Q -40 20 -30 60 Q -10 110 -20 180 Q -40 240 -70 290 Q -100 320 -110 300 Q -110 240 -120 170 Q -140 120 -110 60 Q -80 10 -60 -20 Z" />
      <!-- Caribbean Islands -->
      <circle cx="-10" cy="-25" r="4" />
      <circle cx="5" cy="-20" r="3" />
      <circle cx="20" cy="-10" r="5" />
    </g>
  </g>

  <!-- Eastern Hemisphere Circle (Europe, Africa, Asia, Australia) -->
  <g transform="translate(1360, 540)">
    <circle r="440" fill="none" stroke="#8c622b" stroke-width="2" stroke-opacity="0.4" />
    <circle r="432" fill="none" stroke="#c29b62" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.5" />
    <circle r="424" fill="none" stroke="#8c622b" stroke-width="1.5" stroke-opacity="0.3" />
    <circle r="420" fill="url(#hemisphereGlow)" />

    <!-- Curved Latitude Lines -->
    <ellipse cx="0" cy="0" rx="420" ry="140" fill="none" stroke="#a07238" stroke-width="0.8" stroke-dasharray="6,4" stroke-opacity="0.35" />
    <ellipse cx="0" cy="0" rx="420" ry="280" fill="none" stroke="#a07238" stroke-width="0.8" stroke-dasharray="6,4" stroke-opacity="0.35" />
    <line x1="-420" y1="0" x2="420" y2="0" stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="8,6" />
    <line x1="0" y1="-420" x2="0" y2="420" stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="8,6" />

    <!-- Eastern Continents (Eurasia, Africa, Indonesia, Australia) -->
    <g fill="#996e38" fill-opacity="0.22" stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.45" stroke-linejoin="round">
      <!-- Europe & Asia Silhouette -->
      <path d="M -260 -240 Q -180 -270 -80 -250 Q 40 -260 140 -230 Q 240 -190 280 -120 Q 260 -50 200 -20 Q 150 -10 120 -50 Q 80 -30 40 -60 Q -20 -40 -70 -70 Q -120 -60 -160 -110 Q -200 -120 -240 -180 Z" />
      <!-- Africa Silhouette -->
      <path d="M -220 -80 Q -160 -70 -130 -30 Q -100 20 -110 80 Q -130 160 -160 210 Q -190 240 -220 200 Q -260 140 -280 80 Q -290 0 -260 -40 Z" />
      <!-- Southeast Asia & Indonesian Archipelago Detailed Impression -->
      <g fill="#d4af37" fill-opacity="0.5">
        <path d="M 120 40 Q 140 20 160 35 Q 150 60 130 50 Z" />
        <ellipse cx="140" cy="70" rx="16" ry="6" transform="rotate(-25 140 70)" />
        <ellipse cx="175" cy="85" rx="18" ry="5" transform="rotate(-10 175 85)" />
        <circle cx="210" cy="90" r="5" />
        <ellipse cx="230" cy="70" rx="14" ry="10" />
        <ellipse cx="270" cy="80" rx="22" ry="8" />
      </g>
      <!-- Australia Silhouette -->
      <path d="M 170 140 Q 230 120 270 140 Q 300 180 280 230 Q 230 260 180 240 Q 150 190 170 140 Z" />
    </g>
  </g>

  <!-- GRAND ORNAMENTAL 16-POINT NAUTICAL COMPASS ROSE (Center Bottom) -->
  <g transform="translate(960, 540)">
    <circle r="160" fill="url(#compassGlow)" />
    <circle r="140" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.5" />
    <circle r="125" fill="none" stroke="#99733e" stroke-width="0.8" stroke-dasharray="2,3" stroke-opacity="0.6" />
    <circle r="110" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.4" />
    <circle r="42" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.6" />
    <circle r="10" fill="#d4af37" fill-opacity="0.8" />

    <!-- 16 Radial Points (Star Of The Winds) -->
    <!-- Primary 4 Cardinal Arrows (Gold & Bronze Shading) -->
    <polygon points="0,-135 15,-38 0,0 -15,-38" fill="#ffd875" fill-opacity="0.9" stroke="#b8860b" stroke-width="0.5" />
    <polygon points="0,135 15,38 0,0 -15,38" fill="#8c622b" fill-opacity="0.85" stroke="#5c3f19" stroke-width="0.5" />
    <polygon points="135,0 38,15 0,0 38,-15" fill="#e0b852" fill-opacity="0.9" stroke="#99733e" stroke-width="0.5" />
    <polygon points="-135,0 -38,15 0,0 -38,-15" fill="#7a5525" fill-opacity="0.85" stroke="#523816" stroke-width="0.5" />

    <!-- Secondary 4 Diagonal Points -->
    <polygon points="95,-95 28,-14 0,0 14,-28" fill="#c29b48" fill-opacity="0.8" />
    <polygon points="-95,95 -28,14 0,0 -14,28" fill="#66461c" fill-opacity="0.8" />
    <polygon points="95,95 28,14 0,0 14,28" fill="#a67c33" fill-opacity="0.8" />
    <polygon points="-95,-95 -28,-14 0,0 -14,-28" fill="#523816" fill-opacity="0.8" />

    <!-- Tertiary 8 Mini Points -->
    <g opacity="0.6" fill="#8c622b">
      <polygon points="45,-120 12,-35 0,0" />
      <polygon points="-45,-120 -12,-35 0,0" />
      <polygon points="120,-45 35,-12 0,0" />
      <polygon points="120,45 35,12 0,0" />
      <polygon points="45,120 12,35 0,0" />
      <polygon points="-45,120 -12,35 0,0" />
      <polygon points="-120,-45 -35,-12 0,0" />
      <polygon points="-120,45 -35,12 0,0" />
    </g>

    <!-- Cardinal Initials in Antique Roman Capitals -->
    <text x="0" y="-146" text-anchor="middle" fill="#ffe294" font-size="16" font-family="serif" font-weight="bold" letter-spacing="2">N</text>
    <text x="0" y="162" text-anchor="middle" fill="#ffe294" font-size="16" font-family="serif" font-weight="bold" letter-spacing="2">S</text>
    <text x="156" y="6" text-anchor="middle" fill="#ffe294" font-size="16" font-family="serif" font-weight="bold" letter-spacing="2">E</text>
    <text x="-156" y="6" text-anchor="middle" fill="#ffe294" font-size="16" font-family="serif" font-weight="bold" letter-spacing="2">W</text>
  </g>

  <!-- INTERSECTING MARITIME RHUMB LINES (Authentic Portolan Chart Lines) -->
  <g stroke="#d4af37" stroke-width="0.6" stroke-dasharray="4,8" opacity="0.25">
    <line x1="960" y1="540" x2="160" y2="120" />
    <line x1="960" y1="540" x2="1760" y2="120" />
    <line x1="960" y1="540" x2="160" y2="960" />
    <line x1="960" y1="540" x2="1760" y2="960" />
    <line x1="560" y1="540" x2="1360" y2="540" />
    <line x1="560" y1="120" x2="1360" y2="960" />
    <line x1="560" y1="960" x2="1360" y2="120" />
  </g>

  <!-- TOP BANNER: LATIN ARCHIVAL CARTOGRAPHY TITLE -->
  <g transform="translate(960, 75)" text-anchor="middle" opacity="0.45">
    <rect x="-300" y="-22" width="600" height="40" fill="#140f0a" rx="8" stroke="#8c622b" stroke-width="1" />
    <text y="5" fill="#f0ca85" font-family="serif" font-size="15" font-weight="bold" letter-spacing="5">
      NOVA TOTIUS TERRARUM ORBIS TABULA
    </text>
    <text y="32" fill="#a67c33" font-family="sans-serif" font-size="9" letter-spacing="3">
      CHRONO-GEOGRAPHIC ARCHIVAL MATRIX • STREET VIEW TIME TRAVELER
    </text>
  </g>

  <!-- CORNER ASTRONOMICAL DIALS & CELESTIAL ASTROLABES -->
  <!-- Top-Left Celestial Dial -->
  <g transform="translate(180, 160)" opacity="0.3">
    <circle r="90" fill="none" stroke="#d4af37" stroke-width="1" />
    <circle r="75" fill="none" stroke="#99733e" stroke-width="0.6" stroke-dasharray="3,3" />
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#d4af37" stroke-width="0.8" />
    <line x1="0" y1="-90" x2="0" y2="90" stroke="#d4af37" stroke-width="0.8" />
    <!-- Constellation points -->
    <circle cx="-30" cy="-40" r="2.5" fill="#ffd875" />
    <circle cx="10" cy="-60" r="3" fill="#ffd875" />
    <circle cx="45" cy="-25" r="2" fill="#ffd875" />
    <circle cx="20" cy="35" r="2.5" fill="#ffd875" />
    <circle cx="-45" cy="40" r="2" fill="#ffd875" />
    <polyline points="-30,-40 10,-60 45,-25 20,35 -45,40" fill="none" stroke="#ffd875" stroke-width="0.5" stroke-opacity="0.5" />
  </g>

  <!-- Top-Right Solar Armillary Sphere -->
  <g transform="translate(1740, 160)" opacity="0.3">
    <circle r="90" fill="none" stroke="#d4af37" stroke-width="1" />
    <ellipse cx="0" cy="0" rx="90" ry="35" fill="none" stroke="#d4af37" stroke-width="0.8" transform="rotate(35)" />
    <ellipse cx="0" cy="0" rx="90" ry="35" fill="none" stroke="#99733e" stroke-width="0.8" transform="rotate(-35)" />
    <circle r="18" fill="#d4af37" fill-opacity="0.4" />
  </g>

  <!-- VINTAGE PAPER CREASE & HEAVY CORNER VIGNETTE -->
  <!-- Horizontal Paper Fold Lines -->
  <line x1="0" y1="540" x2="1920" y2="540" stroke="#000000" stroke-width="3" stroke-opacity="0.3" />
  <line x1="0" y1="541" x2="1920" y2="541" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05" />
  <line x1="960" y1="0" x2="960" y2="1080" stroke="#000000" stroke-width="3" stroke-opacity="0.3" />
  <line x1="961" y1="0" x2="961" y2="1080" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05" />

  <!-- Outer Border Frame -->
  <rect x="25" y="25" width="1870" height="1030" fill="none" stroke="#8c622b" stroke-width="2" stroke-opacity="0.5" />
  <rect x="35" y="35" width="1850" height="1010" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="8,4" stroke-opacity="0.35" />

  <!-- Heavy Vignette Gradient Mask -->
  <radialGradient id="vignetteMask" cx="50%" cy="50%" r="55%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0" />
    <stop offset="90%" stop-color="#000000" stop-opacity="0.75" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0.95" />
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vignetteMask)" />
</svg>
